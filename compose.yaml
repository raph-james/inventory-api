name: inventory
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    image: inventory-api:3.0.0
    environment:
      DATABASE_URL: postgresql://inventory:${POSTGRES_PASSWORD}@db:5432/inventory
      APP_VERSION: 3.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
networks:
  backend: {}
volumes:
  db-data: {}
