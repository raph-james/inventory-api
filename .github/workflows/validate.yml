name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: POSTGRES_PASSWORD=ci-only docker compose config -q
      - run: docker build -t inventory-api:ci .
      - name: Runtime smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:5432/unused \
            inventory-api:ci
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
