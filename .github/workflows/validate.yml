name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway value. .env is gitignored, so Compose needs this
      # variable from the environment on the runner.
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: docker compose config -q
      - run: docker build -t inventory-api:ci .

      - name: Runtime smoke test (full Compose stack)
        run: |
          docker compose up -d --build
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Health check passed on attempt $i"
              # Prove the full path: API -> Docker DNS -> PostgreSQL -> response
              curl -fsS http://localhost:8000/api/systems
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass within 60 seconds"
          exit 1

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down -v
